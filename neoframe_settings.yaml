blueprint:
  name: NeoFrame Settings Server
  description: >
    Serves the NeoFrame e-paper photo frame's remote settings JSON (schedule,
    timezone, power_profile, paused, image_url) from a Home Assistant
    webhook, so Home Assistant is the single source of truth for NeoFrame's
    cron-style wake schedule and its presence-driven `paused` flag.


    Point NeoFrame's Settings URL (`config_url`, on its always-on settings
    page at `http://<device-ip>/`) at the webhook URL this automation
    creates once you save it - copy it from the webhook trigger's "Copy
    URL" button. NeoFrame polls it on its own schedule; nothing needs to be
    called from Home Assistant.


    Always returns a fresh 200 with the full JSON (no ETag/Last-Modified,
    so no 304 support) - NeoFrame already skips writing flash when fetched
    settings are unchanged from what it already has, so this only costs a
    slightly larger response, not extra flash wear.
  domain: automation
  source_url: https://github.com/tomschut/neoframe-settings-blueprint/blob/master/neoframe_settings.yaml
  input:
    image_url:
      name: Image URL
      description: >
        Full URL (with scheme) of the image NeoFrame should render, e.g.
        http://192.168.1.10:8000/frame.
      selector:
        text: {}
    timezone:
      name: Timezone
      description: >
        POSIX TZ rule NeoFrame uses to evaluate the schedule below, e.g.
        Europe/Amsterdam, UTC, or a raw POSIX rule like
        CET-1CEST,M3.5.0,M10.5.0/3.
      default: Europe/Amsterdam
      selector:
        text: {}
    power_profile:
      name: Power profile
      description: >
        low_power deep-sleeps between schedule windows (battery use).
        ac_power follows the same schedule but never sleeps and keeps
        NeoFrame's own settings page reachable at all times (mains-powered
        use). always_on ignores the schedule below entirely.
      default: low_power
      selector:
        select:
          mode: dropdown
          options:
            - low_power
            - ac_power
            - always_on
    schedule:
      name: Schedule
      description: >
        List of wake windows. Each entry: days (daily, a weekday like mon,
        or a range like mon-fri), start/stop (HH:MM, end exclusive), and
        every (interval while awake, e.g. 5m or 1h, from 3m to 24h).
      default:
        - days: daily
          start: "08:00"
          stop: "22:00"
          every: "5m"
      selector:
        object: {}
    paused_entity:
      name: Paused-when-not source entity
      description: >
        A binary_sensor, group, or input_boolean whose state decides
        NeoFrame's paused flag - e.g. reuse the same presence
        sensor/group the pause/resume blueprint uses.
      selector:
        entity:
          domain:
            - binary_sensor
            - group
            - input_boolean
    active_state:
      name: Active state
      description: >
        The state of the entity above that means NeoFrame should be
        active (not paused). Any other state pauses it.
      default: "on"
      selector:
        select:
          mode: dropdown
          options:
            - "on"
            - "off"

trigger:
  - trigger: webhook
    allowed_methods:
      - GET
    local_only: true

condition: []

variables:
  paused_entity: !input paused_entity
  active_state: !input active_state
  payload:
    timezone: !input timezone
    power_profile: !input power_profile
    image_url: !input image_url
    schedule: !input schedule
    paused: "{{ states(paused_entity) != active_state }}"

action:
  - stop: ""
    response_variable: payload
